<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="320" viewBox="0 0 1140 320" role="img"><title>score versus load</title><desc>Identical projected box shape, contact geometry and pair score. Only the internal centre of mass changes from centred to 2 centimetres right. The gravity arrows act at their respective centres of mass. The balance calculation is the earlier planar two-finger model.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1140" height="320" fill="white"/><defs><marker id="navy" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#17334a"/></marker><marker id="slate" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#566c7b"/></marker><marker id="coral" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#be513b"/></marker><marker id="green" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#07825e"/></marker><marker id="blue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#3f78a1"/></marker></defs><text x="285.00" y="31.00" font-size="29" fill="#17334a" text-anchor="middle" font-weight="bold">Centered mass</text><rect x="198.0" y="62" width="174.0" height="232" fill="#eaf1f5" fill-opacity=".75" stroke="#c8d2d9" stroke-width="2"/><rect x="181.0" y="137" width="17" height="82" rx="2" fill="#a9c4d5" stroke="#17334a" stroke-width="2"/><rect x="372.0" y="137" width="17" height="82" rx="2" fill="#a9c4d5" stroke="#17334a" stroke-width="2"/><line x1="198.00" y1="178.00" x2="372.00" y2="178.00" stroke="#566c7b" stroke-width="2" opacity="1" stroke-dasharray="7 5"/><circle cx="198.00" cy="178.00" r="6" fill="#be513b" stroke="white" stroke-width="1"/><circle cx="372.00" cy="178.00" r="6" fill="#be513b" stroke="white" stroke-width="1"/><circle cx="285.00" cy="178.00" r="3" fill="#17334a" stroke="none" stroke-width="1"/><circle cx="285.00" cy="178.00" r="8" fill="#be513b" stroke="white" stroke-width="2"/><line x1="285.00" y1="188.00" x2="285.00" y2="270.00" stroke="#be513b" stroke-width="4" opacity="1" marker-end="url(#coral)"/><text x="303.00" y="162.00" font-size="27" fill="#be513b" text-anchor="start" font-weight="normal">CoM</text><text x="303.00" y="265.00" font-family="Cambria Math,STIX Two Math,serif" font-size="30" fill="#18242c" text-anchor="start"><tspan font-style="italic" font-weight="normal">mg</tspan></text><text x="273.00" y="207.00" font-size="22" fill="#17334a" text-anchor="end" font-weight="normal">O</text><text x="855.00" y="31.00" font-size="29" fill="#17334a" text-anchor="middle" font-weight="bold">Mass shifted right</text><rect x="768.0" y="62" width="174.0" height="232" fill="#eaf1f5" fill-opacity=".75" stroke="#c8d2d9" stroke-width="2"/><rect x="751.0" y="137" width="17" height="82" rx="2" fill="#a9c4d5" stroke="#17334a" stroke-width="2"/><rect x="942.0" y="137" width="17" height="82" rx="2" fill="#a9c4d5" stroke="#17334a" stroke-width="2"/><line x1="768.00" y1="178.00" x2="942.00" y2="178.00" stroke="#566c7b" stroke-width="2" opacity="1" stroke-dasharray="7 5"/><circle cx="768.00" cy="178.00" r="6" fill="#be513b" stroke="white" stroke-width="1"/><circle cx="942.00" cy="178.00" r="6" fill="#be513b" stroke="white" stroke-width="1"/><circle cx="855.00" cy="178.00" r="3" fill="#17334a" stroke="none" stroke-width="1"/><circle cx="913.00" cy="178.00" r="8" fill="#be513b" stroke="white" stroke-width="2"/><line x1="913.00" y1="188.00" x2="913.00" y2="270.00" stroke="#be513b" stroke-width="4" opacity="1" marker-end="url(#coral)"/><text x="895.00" y="162.00" font-size="27" fill="#be513b" text-anchor="end" font-weight="normal">CoM</text><line x1="898.00" y1="167.00"