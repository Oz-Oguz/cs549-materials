<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" role="img"><title>gripper frame</title><desc>The contact-midpoint frame G has x_G along the pair, z_G toward the palm and pregrasp side, and y_G completing a right-handed frame. H is the tool/palm centre 0.10 metres along +z_G. Approach travel is minus z_G. This frame belongs to the declared teaching gripper.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="620" height="420" fill="white"/><defs><marker id="navy" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#17334a"/></marker><marker id="slate" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#566c7b"/></marker><marker id="coral" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#be513b"/></marker><marker id="green" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#07825e"/></marker><marker id="blue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#3f78a1"/></marker></defs><polygon points="252.87,295.17 275.46,280.25 275.46,114.44 252.87,129.36" fill="#c2d5e0" stroke="#17334a" stroke-width="1.6" fill-opacity="0.75"/><polygon points="240.65,290.76 252.87,295.17 252.87,129.36 240.65,124.95" fill="#c2d5e0" stroke="#17334a" stroke-width="1.6" fill-opacity="0.75"/><polygon points="299.37,407.84 412.31,333.24 412.31,200.59 299.37,275.19" fill="#eaf1f5" stroke="#c8d2d9" stroke-width="1.6" fill-opacity="0.4"/><polygon points="207.69,242.10 299.37,275.19 412.31,200.59 320.63,167.51" fill="#eaf1f5" stroke="#c8d2d9" stroke-width="1.6" fill-opacity="0.4"/><polygon points="240.65,124.95 252.87,129.36