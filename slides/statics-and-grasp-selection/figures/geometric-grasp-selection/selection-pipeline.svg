<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="290" viewBox="0 0 1140 290" role="img"><title>selection pipeline</title><desc>Planning moves from target observations and ranked pairs to gripper, path, load and robot effort checks. Execution approaches with open jaws, checks acquisition after closing, then tests the lift.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1140" height="290" fill="white"/><defs><marker id="navy" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#17334a"/></marker><marker id="slate" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#566c7b"/></marker><marker id="coral" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#be513b"/></marker><marker id="green" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#07825e"/></marker><marker id="blue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#3f78a1"/></marker></defs><text x="8.00" y="83.00" font-size="26" fill="#17334a" text-anchor="start" font-weight="bold">Plan</text><rect x="124.0" y="35" width="226.0" height="83" rx="9" fill="#eaf1f5" stroke="#c8d2d9" stroke-width="1.5"/><text x="237.00" y="69.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">Identify target</text><text x="237.00" y="99.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">surfaces</text><line x1="353.00" y1="77.00" x2="379.00" y2="77.00" stroke="#566c7b" stroke-width="2" opacity="1" marker-end="url(#slate)"/><rect x="382.0" y="35" width="226.0" height="83" rx="9" fill="#eaf1f5" stroke="#c8d2d9" stroke-width="1.5"/><text x="495.00" y="69.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">Propose and</text><text x="495.00" y="99.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">rank pairs</text><line x1="611.00" y1="77.00" x2="637.00" y2="77.00" stroke="#566c7b" stroke-width="2" opacity="1" marker-end="url(#slate)"/><rect x="640.0" y="35" width="226.0" height="83" rx="9" fill="#eaf1f5" stroke="#c8d2d9" stroke-width="1.5"/><text x="753.00" y="69.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">Check gripper</text><text x="753.00" y="99.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">pose and path</text><line x1="869.00" y1="77.00" x2="895.00" y2="77.00" stroke="#566c7b" stroke-width="2" opacity="1" marker-end="url(#slate)"/><rect x="898.0" y="35" width="226.0" height="83" rx="9" fill="#eaf1f5" stroke="#c8d2d9" stroke-width="1.5"/><text x="1011.00" y="69.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">Check load</text><text x="1011.00" y="99.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">and robot effort</text><text x="8.00" y="239.00" font-size="26" fill="#17334a" text-anchor="start" font-weight="bold">Execute</text><rect x="124.0" y="191" width="312.0" height="83" rx="9" fill="#edf4f1" stroke="#c8d2d9" stroke-width="1.5"/><text x="280.00" y="225.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">Approach with</text><text x="280.00" y="255.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">open jaws</text><line x1="439.00" y1="233.00" x2="465.00" y2="233.00" stroke="#566c7b" stroke-width="2" opacity="1" marker-end="url(#slate)"/><rect x="468.0" y="191" width="312.0" height="83" rx="9" fill="#edf4f1" stroke="#c8d2d9" stroke-width="1.5"/><text x="624.00" y="225.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">Close and check</text><text x="624.00" y="255.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">contact acquisition</text><line x1="783.00" y1="233.00" x2="809.00" y2="233.00" stroke="#566c7b" stroke-width="2" opacity="1" marker-end="url(#slate)"/><rect x="812.0" y="191" width="312.0" height="83" rx="9" fill="#edf4f1" stroke="#c8d2d9" stroke-width="1.5"/><text x="968.00" y="225.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">Lift and check the box</text><text x="968.00" y="255.00" font-size="24" fill="#17334a" text-anchor="middle" font-weight="normal">stays held and level</text><path d="M1011,118 V151 H280 V185" fill="none" stroke="#566c7b" stroke-width="2" marker-end="url(#slate)"/></svg>
