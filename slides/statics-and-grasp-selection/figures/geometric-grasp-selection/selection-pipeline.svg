<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="340" viewBox="0 0 1140 340" role="img"><title>selection pipeline</title><desc>A proposed programming sequence combines observations, pair and pose proposal, geometric rejection and ranking, contact and robot-effort checks, and approach/contact acquisition/lift assessment. A failed check returns to candidate selection. It is not a uniquely required computational order.</desc><style>text{font-family:Arial,Helvetica,sans-serif}</style><rect width="1140" height="340" fill="white"/><defs><marker id="navy" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#17334a"/></marker><marker id="slate" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#566c7b"/></marker><marker id="coral" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#be513b"/></marker><marker id="green" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#07825e"/></marker><marker id="blue" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0L11,5.5L0,11Z" fill="#3f78a1"/></marker></defs><rect x="15" y="86" width="182" height="138" rx="12" fill="#eaf1f5" stroke="#c8d2d9" stroke-width="1.5"/><text x="106.00" y="143.00" font-size="26" fill="#17334a" text-anchor="middle" font-weight="normal">Observe</text><text x="106.00" y="179.00" font-size="26" fill="#17334a" text-anchor="middle" font-weight="normal">surfaces</text><line x1="201.00" y1="155.00" x2="242.00" y2="155.00" stroke="#566c7b" stroke-width="2.5" opacity="1" marker-end="url(#slate)"/><rect x="247" y="86" width="182" height="138" rx="12" fill="#eaf1f5" stroke="#c8d2d9" stroke-width="1.5"/><text x="338.00" y="143.00" font-size="26" fill="#17334a" text-anchor="middle" font-weight="normal">Propose</text><text x="338.00" y="179.00" font-size="26" fill="#17334a" text-anchor="middle" font-weight="normal">pairs / poses</text><line x1="433.00" y1="155.00" x2="474.00" y2="155.00" stroke="#566c7b" stroke-width="2.5" opacity="1" marker-end="url(#slate)"/><rect x="479" y="86" width="182" height="138" rx="12" fill="#eaf1f5" stroke="#c8d2d9" stroke-width="1.5"/><text x="570.00" y="143.00" font-size="26" fill="#17334a" text-anchor="middle" font-weight="normal">Geometry</text><text x="570.00" y="179.00" font-size="26" fill="#17334a" text-anchor="middle" font-weight="normal">and ranking</text><line x1="665.00" y1="155.00" x2="706.00" y2="155.00" stroke="#566c7b" stroke-width="2.5" opacity="1" marker-end="url(#slate)"/><rect x="711" y="86" width="182" height="138" rx="12" fill="#eaf1f5" stroke="#c8d2d9" stroke-width="1.5"/><text x="802.00" y="143.00" font-size="26" fill="#17334a" text-anchor="middle" font-weight="normal">Check forces</text><text x="802.00" y="179.00" font-size="26" fill="#17334a" text-anchor="middle" font-weight="normal">and effort</text><line x1="897.00" y1="155.00" x2="938.00" y2="155.00" stroke="#566c7b" stroke-width="2.5" opacity="1" marker-end="url(#slate)"/><rect x="943" y="86" width="182" height="138" rx="12" fill="#edf4f1" stroke="#c8d2d9" stroke-width="1.5"/><text x="1034.00" y="143.00" font-size="26" fill="#17334a" text-anchor="middle" font-weight="normal">Approach,</text><text x="1034.00" y="179.00" font-size="26" fill="#17334a" text-anchor="middle" font-weight="normal">close, test lift</text><path d="M802,224V276H338V224" fill="none" stroke="#566c7b" stroke-width="2.2" marker-end="url(#slate)"/><path d="M1034,224V276H802" fill="none" stroke="#566c7b" stroke-width="2.2"/><text x="686.00" y="315.00" font-size="25" fill="#566c7b" text-anchor="middle" font-weight="normal">Try another candidate when a check fails</text></svg>
