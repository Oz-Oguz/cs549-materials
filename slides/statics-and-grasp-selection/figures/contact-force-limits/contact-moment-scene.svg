<svg xmlns="http://www.w3.org/2000/svg" width="350" height="280" viewBox="0 0 350 280" role="img"><title>A rightward push at height h produces a clockwise moment about base midpoint T. The offset normal force supplies an opposing counterclockwise contact moment. Only moment-producing forces are shown.</title><defs><marker id="normal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#07825e"/></marker><marker id="tangent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#be513b"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><rect x="85" y="45" width="180" height="120" fill="#f2f5f6" stroke="#17334a" stroke-width="2"/><path d="M30,165H320" stroke="#566c7b" stroke-width="4"/><path d="M15,75L85,75" fill="none" stroke="#be513b" stroke-width="4" marker-end="url(#tangent)"/><text x="45" y="52" font-size="32" fill="#be513b" text-anchor="middle"><tspan font-family="Georgia,serif" font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="22">p</tspan></text><path d="M235,165L235,85" fill="none" stroke="#07825e" stroke-width="4" marker-end="url(#normal)"/><circle cx="235" cy="165" r="4" fill="#17334a"/><text x="253" y="112" font-size="32" fill="#07825e" text-anchor="start"><tspan font-family="Georgia,serif" font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="22">n</tspan></text><circle cx="175" cy="165" r="4" fill="#17334a"/><text x="175" y="198" font-size="32" fill="#17334a" text-anchor="middle"><tspan font-family="Georgia,serif" font-style="italic">T</tspan></text><path d="M52,75L52,165" fill="none" stroke="#566c7b" stroke-width="2" /><path d="M46,75L58,75" fill="none" stroke="#566c7b" stroke-width="2" /><path d="M46,165L58,165" fill="none" stroke="#566c7b" stroke-width="2" /><text x="29" y="135" font-size="32" fill="#17334a" text-anchor="middle"><tspan font-family="Georgia,serif" font-style="italic">h</tspan></text><path d="M135,228 Q175,275 225,228" fill="none" stroke="#07825e" stroke-width="3" marker-end="url(#normal)"/><text x="180" y="231" font-size="32" fill="#07825e" text-anchor="middle"><tspan font-family="Georgia,serif" font-style="italic">τ</tspan><tspan baseline-shift="super" font-size="22">ct</tspan></text></g></svg>