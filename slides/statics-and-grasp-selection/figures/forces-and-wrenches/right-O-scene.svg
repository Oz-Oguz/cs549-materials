<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" data-variant="scene" style="font-size:30px;fill:#17334a" role="img" aria-labelledby="title desc">
    <title id="title">Forces on the box; reporting point O</title>
    <desc id="desc">A box with downward weight 9.81 N at O and upward support 9.81 N at S. Forces and positions are expressed in W. Perpendicular lever arms are shown.</desc>
    <style>text{font-family:Arial,Helvetica,sans-serif;}svg{background:white}</style>
    <rect width="620" height="420" fill="white"/><defs>
    <marker id="force" markerWidth="15" markerHeight="15" refX="15" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7.5 L0,15 Z" fill="#be513b"/></marker>
    <marker id="weight" markerWidth="15" markerHeight="15" refX="15" refY="7.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L15,7.5 L0,15 Z" fill="#17334a"/></marker>
    <marker id="axis" markerWidth="11" markerHeight="11" refX="11" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,5.5 L0,11 Z" fill="#566c7b"/></marker>
  </defs><rect x="238" y="104" width="144" height="192" rx="3" fill="#f2f5f6" stroke="#17334a" stroke-width="3.5"/>
    <path d="M382,124 L422,143 L431,143" stroke="#566c7b" stroke-width="2" fill="none"/>
    <text x="438" y="153" aria-label="1 kg box" font-size="26" fill="#566c7b">1 kg box</text>
    <line x1="65" y1="325" x2="120" y2="325" stroke="#566c7b" stroke-width="3" marker-end="url(#axis)"/>
    <line x1="65" y1="325" x2="65" y2="275" stroke="#566c7b" stroke-width="3" marker-end="url(#axis)"/>
    <text x="130" y="334" aria-label="x" font-size="26" font-style="italic">x</text><text x="57" y="264" aria-label="z" font-size="26" font-style="italic">z</text>
    <text x="20" y="365" aria-label="⊗ +y into page" font-size="24">⊗ +y into page</text>
    <text x="20" y="400" aria-label="W axes" font-size="24" fill="#566c7b">W axes</text><line x1="358" y1="39" x2="358" y2="288" stroke="#be513b" stroke-width="2" stroke-dasharray="5 5"/>
        <line x1="310" y1="39" x2="310" y2="180" stroke="#566c7b" stroke-width="2" stroke-dasharray="5 5"/>
        <g data-lever-arm="support">
    <line x1="358" y1="40" x2="310" y2="40" stroke="#be513b" stroke-width="2.5"/>
    <line x1="358" y1="35" x2="358" y2="45" stroke="#be513b" stroke-width="2"/>
    <line x1="310" y1="35" x2="310" y2="45" stroke="#be513b" stroke-width="2"/>
    <text x="334" y="28" aria-label="support: 0.02 m" text-anchor="middle" font-size="28" fill="#be513b">support: 0.02 m</text></g><line x1="310" y1="200" x2="310" y2="278.48" stroke="#17334a" stroke-width="4.5" marker-end="url(#weight)"/>
      <text x="214" y="188" aria-label="Weight" text-anchor="end" font-size="24" fill="#566c7b">Weight</text>
      <text x="214" y="225" aria-label="9.81 N" text-anchor="end" font-size="30">9.81 N</text>
      <path d="M220,227 L275,249 L303,249" stroke="#566c7b" stroke-width="2" fill="none"/>
      <line x1="358" y1="374.48" x2="358" y2="296" stroke="#be513b" stroke-width="4.5" marker-end="url(#force)"/>
      <circle cx="358" cy="296" r="4" fill="#be513b"/>
      <text x="373" y="324" aria-label="S" fill="#be513b" font-weight="700">S</text>
      <text x="440" y="334" aria-label="Support" font-size="24" fill="#566c7b">Support</text>
      <text x="440" y="369" aria-label="9.81 N" fill="#be513b" font-size="30">9.81 N</text><circle cx="310" cy="200" r="5" fill="#17334a"/>
