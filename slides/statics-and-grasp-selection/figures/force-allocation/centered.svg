<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 420" width="620" height="420" role="img" aria-labelledby="desc"><desc id="desc">Planar forces on a centered 1 kg box: 12 N inward compression and 4.905 N upward friction at each side contact; 9.81 N gravity acts at O, the center of mass. x points right, z up. Equal physical-axis scales; force arrows use 10 pixels per newton.</desc><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17334a"/></marker><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#566c7b"/></marker><marker id="coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#be513b"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#07825e"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="220" y="85" width="180" height="240" fill="#f2f5f6" stroke="#17334a" stroke-width="2"/><text x="310" y="117" font-size="25" fill="#17334a" text-anchor="middle">1 kg box</text><path d="M100,205 L220,205" stroke="#07825e" stroke-width="4" fill="none"  marker-end="url(#green)"/><path d="M520,205 L400,205" stroke="#07825e" stroke-width="4" fill="none"  marker-end="url(#green)"/><text x="156" y="244" font-size="25" fill="#07825e" text-anchor="middle">12 N</text><text x="464" y="244" font-size="25" fill="#07825e" text-anchor="middle">12 N</text><path d="M220,205 L220,155.95" stroke="#be513b" stroke-width="4" fill="none"  marker-end="url(#coral)"/><path d="M400,205 L400,155.95" stroke="#be513b" stroke-width="4" fill="none"  marker-end="url(#coral)"/><text x="202" y="143.95" font-size="26" fill="#be513b" text-anchor="end">4.905 N</text><text x="418" y="143.95" font-size="26" fill="#be513b" text-anchor="start">4.905 N</text><circle cx="220" cy="205" r="5" fill="#17334a"/><circle cx="400" cy="205" r="5" fill="#17334a"/><circle cx="310" cy="205" r="5" fill="#17334a"/><text x="310" y="179" font-size="24" fill="#17334a" text-anchor="middle">O = CoM</text><path d="M310,205 L310,303.1" stroke="#17334a" stroke-width="4" fill="none"  marker-end="url(#navy)"/><path d="M310,311.1 L310,347" stroke="#566c7b" stroke-width="2" fill="none" /><text x="310" y="379" font-size="26" fill="#17334a" text-anchor="middle">9.81 N</text><path d="M48,351 L100,351" stroke="#17334a" stroke-width="4" fill="none"  marker-end="url(#navy)"/><path d="M48,351 L48,299" stroke="#17334a" stroke-width="4" fill="none"  marker-end="url(#navy)"/><text x="115" y="359" font-size="24" fill="#17334a" text-anchor="middle">x</text><text x="48" y="285" font-size="24" fill="#17334a" text-anchor="middle">z</text></g></svg>