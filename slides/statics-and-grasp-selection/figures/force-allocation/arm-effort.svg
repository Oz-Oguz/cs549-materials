<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 310" width="1140" height="310" role="img" aria-labelledby="desc"><desc id="desc">Two static configurations of a separate ideal massless 0.30 m one-link arm. Both apply the same upward 9.81 N force to a load; the arm feels its opposite. Horizontal lever arms are 0.30 m at zero degrees and 0.15 m at 60 degrees. Required joint-torque magnitudes are 2.943 and 1.4715 N m. Positive joint angle is counterclockwise in xz, about minus y. Link geometry is to one common scale; identical force arrows are direction schematics.</desc><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17334a"/></marker><marker id="slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#566c7b"/></marker><marker id="coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#be513b"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#07825e"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><path d="M88,253 L110,230 L132,253Z" fill="#e3eaee" stroke="#566c7b" stroke-width="2"/><path d="M110,230 L280,230" stroke="#17334a" stroke-width="8" stroke-linecap="round"/><circle cx="110" cy="230" r="9" fill="white" stroke="#17334a" stroke-width="3"/><circle cx="280" cy="230" r="6" fill="#17334a"/><path d="M280,230 L280,170" stroke="#be513b" stroke-width="4" fill="none"  marker-end="url(#coral)"/><text x="300" y="194" font-size="27" fill="#be513b" text-anchor="start">9.81 N</text><text x="300" y="223" font-size="24" fill="#566c7b" text-anchor="start">to load</text><text x="180" y="206" font-size="26" fill="#566c7b" text-anchor="middle">0°</text><path d="M1