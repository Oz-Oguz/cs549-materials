<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" role="img"><defs><marker id="navy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#17334a"/></marker><marker id="coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#be513b"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#07825e"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="110" y="65" width="140" height="160" fill="#f2f5f6" stroke="#17334a" stroke-width="2"/><path d="M65,227 L295,227" stroke="#17334a" stroke-width="2" fill="none" /><path d="M180,130 L180,207" stroke="#17334a" stroke-width="4" fill="none" marker-end="url(#navy)"/><path d="M180,304 L180,227" stroke="#07825e" stroke-width="4" fill="none" marker-end="url(#green)"/><text x="180" y="35" font-size="26" fill="#17334a" text-anchor="middle">Frictionless table</text><text x="180" y="325" font-size="24" fill="#17334a" text-anchor="middle">Holds gravity</text><text x="180" y="360" font-size="22" fill="#566c7b" text-anchor="middle">Cannot oppose a sideways load</text><rect x="695" y="65" width="140" height="160" fill="#f2f5f6" stroke="#17334a" stroke-width="2"/><path d="M695,145 L805,90 L805,200 Z" fill="#07825e" fill-opacity="0.10" stroke="none"/><path d="M695,145 L805,90" stroke="#07825e" stroke-width="2" fill="none" /><path d="M695,145 L805,200" stroke="#07825e" stroke-width="2" fill="none" /><path d="M835,145 L725,90 L725,200 Z" fill="#07825e" fill-opacity="0.10" stroke="none"/><path d="M835,145 L725,90" stroke="#07825e" stroke-width="2" fill="none" /><path d="M835,145 L725,200" stroke="#07825e" stroke-width="2" fill="none" /><path d="M695,145 L835,145" stroke="#566c7b" stroke-width="2" fill="none" stroke-dasharray="6 5"/><path d="M695,145 L775,115" stroke="#be513b" stroke-width="4" fill="none" marker-end="url(#coral)"/><path d="M835,145 L755,115" stroke="#be513b" stroke-width="4" fill="none" marker-end="url(#coral)"/><circle cx="695" cy="145" r="5" fill="#17334a"/><circle cx="835" cy="145" r="5" fill="#17334a"/><text x="680" y="137" font-size="24" fill="#be513b" text-anchor="end"><tspan font-family="Georgia,serif" font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="16">1</tspan></text><text x="850" y="137" font-size="24" fill="#be513b" text-anchor="start"><tspan font-family="Georgia,serif" font-style="italic">f</tspan><tspan baseline-shift="sub" font-size="16">2</tspan></text><text x="765" y="35" font-size="26" fill="#17334a" text-anchor="middle">Opposed frictional points</text><text x="765" y="258" font-size="22" fill="#07825e" text-anchor="middle">Shown: force AND moment balance</text><text x="765" y="289" font-size="20" fill="#566c7b" text-anchor="middle">Equal upward components support the weight</text><text x="765" y="328" font-size="24" fill="#17334a" text-anchor="middle">Planar force closure for <tspan font-family="Georgia,serif" font-style="italic">μ</tspan><tspan baseline-shift="sub" font-size="16">f</tspan> &gt; 0</text><text x="765" y="364" font-size="18" fill="#566c7b" text-anchor="middle">Can also oppose forces and moments in every planar direction</text><path d="M765,145 L765,205" stroke="#17334a" stroke-width="4" fill="none" marker-end="url(#navy)"/><text x="780" y="212" font-size="21" fill="#17334a" text-anchor="start">mg</text></g></svg>